<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunport Heat — an original open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0b10;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    width: min(1280px, 100vw);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #b3a06f;
    cursor: crosshair;
  }
  #hint {
    color: #888;
    font-size: 13px;
    text-align: center;
    padding: 8px 0 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">WASD move &amp; drive &middot; E enter a car &middot; F punch &middot; mouse + click shoot &middot; Space handbrake &middot; Esc pause &middot; M mute</div>
</div>
<script type="module" src="src/boot.js"></script>
</body>
</html>
